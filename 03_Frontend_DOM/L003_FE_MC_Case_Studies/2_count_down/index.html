<!-- 

    Problem statement: Count down timer.

    ## Requrements.
    Must have features 
        * Pass tim ein housr, minute and seconds.
        * Play, Pause and continue button and it's toggling on the basis of event.
        * Phase 1: Validation check and print timer on console only.
        * Phase 2: All button should work and Up update.
        * Phase 3: Follow Up. 


    Good to have options:
        * reset Option.

    Approach:
        1. HTML/CSS
           Preapre with basic/static HTML/CSS.
        
        2. JavaScript:
           a. We have to listen to five event listners -> H,M,S, Start, Pause, reset
           b. Validation check
           c. Update UI
           
        Edge Case:
           Reset Option.
 -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>Count Down timer</h1>
        <h2 class="timer__label--hrs">Hours</h2>
        <h2 class="timer__label--mins">Minutes</h2>
        <h2 class="timer__label--sec">Second</h2>
    </div>

    <!-- All the inputs are upto of 2 digits -->
    <div class="timer_inputs">
        <input type="number" id="hr">
        <input type="number" id="min">
        <input type="number" id="sec">
    </div>



    <!-- Buttons -->
    <div class="container__btns">
        <button class="btn start" id="start">Start</button>
        <button class="btn reset" id="reset">Reset</button>
        <button class="btn pause" id="pause">Pause</button>
        <button class="btn continue" id="continue">Continue</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
