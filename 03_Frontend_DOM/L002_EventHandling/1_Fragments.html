    </ul>

<script>

    let ul = document.querySelector("#listContainer");
    let N = 1000;

    // T: O(N^2)
    // for(let i = 0; i < N;i++){
    //     // creation.
    //     let newLi = document.createElement("li");

    //     //update.
    //     newLi.textContent = `Item ${i}`;

    //     //Append.

    //     ul.appendChild(newLi);
    // }

    // Smarter way to solve above problem.

    let fragment = document.createDocumentFragment();
    let secondUl = document.createElement("div");
    // T: O(N)
    for (let i = 0; i < N; i++) {
        // creation.
        let newLi = document.createElement("li");

        //update.
        newLi.textContent = `Item ${i}`;

        //Append.
        secondUl.appendChild(newLi);
    }

    ul.appendChild(secondUl); // O(N), because we are adding in local memory.
</script>
