    <script>
      const dfs = (i, j, dir, limit) => {
        if (i == 8 || j % 8 == limit) {
          const box = document.getElementById(`${j}`);
          box.style.backgroundColor = "red";
          return;
        }

        const box = document.getElementById(`${j}`);
        box.style.backgroundColor = "red";
        console.log(i, j, j + 9);
        for (const [dx, dy] of dir) {
          const nr = i + dx;
          const nc = j + dy + 8;
          if (nr >= 1 && nr <= 8 && nc >= 1 && nc <= 64) {
            dfs(nr, nc, dir, limit);
          }
        }
      };

      const board = document.querySelector(".board");
      console.log(board, "gggggg");
      board.addEventListener("click", (e) => {
        if (e.target.classList.contains("checkbox")) {
          const parentRowId = e.target.parentElement.getAttribute("id");
          console.log(parentRowId, "SSSSSSSSS");
          const parentId = parentRowId.split("-")[1] * 1;
          const elementId = e.target.getAttribute("id") * 1;

          const left = [[1, -1]];
          const right = [[1, 1]];
          dfs(parentId, elementId, left, 1);
          if (elementId % 8 !== 0) {
            dfs(parentId, elementId, right, 0);
          }
        }
      });
    </script>
