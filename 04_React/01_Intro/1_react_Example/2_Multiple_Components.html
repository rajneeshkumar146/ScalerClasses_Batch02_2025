<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- algorithm to efficiently manipulate your UI -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

    <!-- React DOM  -> uses react to update the DOM-->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- transpiler -> JSX -> into javascript -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

</head>

<body>

    <!-- Whole application lives here -->
    <div id="root"></div>

    <!-- Simgle Page Application! -->
    <script type="text/babel">
        function HELLO(props) {
            let { age, name } = props;
            return <h1 style={{ color: 'red' }}>Hello My Name: {name}, and my age: {age}</h1>
        }

        function BYE() {
            return <p>Bye Component! Hope to see you again!</p>
        }


        // Significance -> You can break a problem into multiple smaller parts.
        // Create -> Parenet coponent using child component. 
        function HELLO_PARENT() {
            return <div>
                <HELLO name={"feraz"} age={25}></HELLO>
                <HELLO name={"Preeti"} age={20}></HELLO>
                <HELLO name={"Selvakumar"} age={23}></HELLO>
                <HELLO name={"Rajneesh"} age={27} />
                <BYE />
            </div>
        }

        // Code Execution will always start from here.
        ReactDOM.render(<HELLO_PARENT />, document.getElementById("root"));
    </script>
</body>

</html>
