<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- algorithm to efficiently manipulate your UI -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

    <!-- React DOM  -> uses react to update the DOM-->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- transpiler -> JSX -> into javascript -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body>
    <!-- Whole application lives here -->
    <div id="root"></div>

    <script type="text/babel">

        function HELLO(props) {
            let { age, occupation } = props;
            let Name = "Rajneesh Kumar";

            return <h1>Hello My Name: {Name}, and my age: {age} and working as {occupation}.</h1>
        }

        ReactDOM.render(<HELLO age={27} occupation={"Mentor@Scaler and SDE@Google"}></HELLO>, document.getElementById("root"));
    </script>

</body>

</html>
